<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Card Website</title>
</head>
<body>
    <div class="mainContainer">
        <div class="cardContainer">
            <div class="image-wrapper">
                <a href="https://youtube.com" target="_blank" >
                    <img src="qrcode.jpeg" alt="Image">
                </a>
            </div>
            <div class="content">
                <h1>YouTube QR Code</h1>
                <p>This QR code will take you to YouTube official home page, please scan the qr code to access YouTube. You can also click on the QR code to access YouTube.</p>
            </div>
        </div>
    </div>
</body>
</html>
