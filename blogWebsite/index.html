<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
</head>
<body class="body_container">

        <header class="header">
            <h1 class="headerTitle">Blog Website</h1>
            <p class="headerDesc">Use this template to customize things like you want to have it in your website.</p>
        </header>

        <main class="mainContainer">
            <a href="#" class="imageSection">
                <img src="https://picsum.photos/600/400" alt="card-text-image" class="cardImage" loading="lazy">
            
            </a>

            <div class="cardTitleContainer">
                <a href="#">
                    <h2 class="cardTitle">New Gadgets released</h2>
                    <p class="cardDesc">Lorem ipsum, dolor sit amet consectetur adipisicing elit. Magnam, eveniet?</p>
                </a>
            </div>

            <div class="cardFooterContainer">
                <div class="authonContainer">
                    <div class="authorAvatarContainer">
                        <img src="" alt="">
                    </div>
                    <div class="authorInfo">
                        <span>
                            John Doe
                        </span>

                        <span>
                            19 sept 2021
                        </span>
                    </div>
                    <div class="cardTagContainer">
                        <span>
                            Technology
                        </span>
                    </div>
                </div>
                <div class="cardTagContainer"></div>
            </div>
        </main>
